<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Users | Waysorted</title>
  <link rel="stylesheet" href="/newsletter-v2.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="workspace" class="workspace">
      <header class="page-head">
        <div class="heading-row">
          <button id="menuToggle" class="icon-button menu-toggle">☰</button>
          <div><p class="overline">People</p><h1>Who is receiving value?</h1><p>Follow each user from signup through login, activation, return, credits, and messaging.</p></div>
        </div>
        <button id="refreshAll" class="button primary">Refresh</button>
      </header>
      <div class="status-bar"><span id="coverageStatus" class="status-chip neutral">Logins, credited jobs and plugin activity</span><span id="lastUpdated">Loading</span></div>
      <div id="globalNotice" class="notice error" hidden></div>
      <div id="userMetrics" class="metric-grid compact"></div>
      <section>
        <div class="toolbar">
          <label class="search-field">Search<input id="search" type="search" placeholder="Name or email"></label>
          <label>Segment<select id="segment"><option value="all">All users</option><option value="new">New</option><option value="not_activated">Not activated</option><option value="activated">Activated</option><option value="engaged">Engaged</option><option value="returning">Returning</option><option value="low_credit">Low credit</option><option value="at_risk">At risk</option><option value="dormant">Dormant</option><option value="payment_attention">Payment attention</option></select></label>
          <label>Country<select id="country"><option value="all">All countries</option></select></label>
          <label>Login source<select id="source"><option value="all">All sources</option></select></label>
          <label>Tool used<select id="tool"><option value="all">All tools</option></select></label>
          <label>Wallet<select id="wallet"><option value="all">All wallets</option><option value="initialized">Initialized</option><option value="missing">Missing</option></select></label>
          <label>Subscription<select id="subscription"><option value="all">All subscriptions</option></select></label>
          <label>Newsletter<select id="newsletter"><option value="all">All statuses</option></select></label>
          <label>Range<select id="rangeDays"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select></label>
          <label>Rows<select id="pageSize"><option>25</option><option>50</option><option>100</option></select></label>
        </div>
        <article class="surface table-surface">
          <div class="table-scroll"><table><thead><tr><th>User</th><th>Stage</th><th>Last active</th><th>Tool jobs</th><th>Latest tool</th><th>Credits</th><th>Newsletter</th></tr></thead><tbody id="usersBody"></tbody></table></div>
          <div id="pager" class="pager"></div>
        </article>
      </section>
    </main>
  </div>
  <aside id="userDrawer" class="drawer" aria-hidden="true"><div class="drawer-head"><div><p class="overline">360° customer profile</p><h2 id="drawerTitle">User</h2></div><button id="closeDrawer" class="icon-button">×</button></div><div id="drawerBody" class="drawer-body"></div></aside>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <script type="module" src="/users.js"></script>
</body>
</html>
